<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AI News</title>
  <desc id="desc">A playful AI news illustration with a friendly robot anchor, circuit lines, and a breaking-news banner.</desc>
  <defs>
