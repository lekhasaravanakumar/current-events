    <linearGradient id="bot" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7ff0d6"/><stop offset="1" stop-color="#22aeca"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#00182e" flood-opacity=".6"/></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#a4f4ef" stroke-width="2" opacity=".12"/></pattern>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/><rect width="1200" height="760" fill="url(#grid)"/>
  <g fill="none" stroke="#8ff6e2" stroke-width="5" opacity=".5">
