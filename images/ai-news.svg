    <rect x="-126" y="-70" width="252" height="133" rx="43" fill="#031e4a"/>
    <circle cx="-59" cy="-1" r="27" fill="#ffd04a"/><circle cx="59" cy="-1" r="27" fill="#ffd04a"/>
    <circle cx="-59" cy="-1" r="9" fill="#031e4a"/><circle cx="59" cy="-1" r="9" fill="#031e4a"/>
    <path d="M-57 35q57 46 114 0" fill="none" stroke="#ef3f4e" stroke-width="12" stroke-linecap="round"/>
